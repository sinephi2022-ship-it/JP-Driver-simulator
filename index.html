<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="路上教習">
<meta name="theme-color" content="#0f1622">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>路上教習シミュレーター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D road scene; HUD floats on it styled as Japanese road furniture
   (blue guide-sign instruction board, round regulatory speed sign, instrument-cluster dash). */
:root{
  color-scheme:dark;
  --night:#0f1622;          /* instrument panel */
  --panel:rgba(15,22,34,.86);
  --line:rgba(255,255,255,.16);
  --paper:#f2f5f8;
  --muted:#a9b4c2;
  --sign-blue:#1c4c9c;      /* 案内・指示標識 */
  --sign-red:#d4222b;       /* 規制標識 */
  --go:#1fc79a;             /* 青信号 */
  --amber:#f6b40e;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans SC",sans-serif;
  --f-body:"Noto Sans SC","Zen Kaku Gothic New","Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--amber);outline-offset:2px}

#hud{position:absolute;inset:0;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-in{position:relative;width:100%;height:100%}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}

#status{display:flex;gap:10px;align-items:center;padding:8px 12px}
.limit{width:50px;height:50px;border-radius:50%;background:#fff;border:6px solid var(--sign-red);display:grid;place-items:center;font:700 24px/1 var(--f-num);color:var(--sign-blue);flex:none}
.score small,.lbl{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.score b{font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums}
.score b.low{color:var(--sign-red)}
#crit{background:var(--sign-red);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px}

#instr{justify-self:center;max-width:560px;min-width:0;display:grid;gap:6px}
.board{background:var(--sign-blue);border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2px var(--sign-blue);display:flex;align-items:center;gap:12px;padding:8px 14px;color:#fff}
.board .arrow{font:900 34px/1 var(--f-display);width:38px;text-align:center;flex:none}
.board .txt{font:700 16px/1.3 var(--f-display);min-width:0}
.board .dist{font:700 20px/1 var(--f-num);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#hint{background:var(--panel);border-left:4px solid var(--amber);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--paper)}

.side{display:grid;gap:6px;justify-items:end}
#map{width:150px;height:auto;display:block;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.mini{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px}
.mini:hover{border-color:var(--paper)}
.mini.lit{border-color:var(--go);color:var(--go)}
#map{pointer-events:auto;cursor:pointer}
.stk{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);min-width:74px;height:42px;padding:0 10px;border-radius:21px;background:rgba(15,22,34,.5);border:1.5px solid rgba(255,255,255,.6);font:700 12px/1 var(--f-display);pointer-events:auto;touch-action:none;display:none;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.stk i{font-style:normal;color:var(--go)}.stk.on{border-color:var(--go);color:var(--go);background:rgba(31,199,154,.22)}
@media (hover:none),(pointer:coarse){.stk{display:flex}}
#bigmap{align-items:flex-start}#bigmap .card{margin:0 auto}#bigmap .row{position:sticky;bottom:0;background:var(--night);padding-block:8px}
#glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#glare{position:absolute;inset:0;pointer-events:none;opacity:0;background:#fff}

#toasts{position:absolute;left:0;top:132px;display:grid;gap:6px;width:min(330px,82vw)}
.toast{background:var(--panel);border-left:5px solid var(--amber);border-radius:6px;padding:7px 10px;font-size:13px;animation:in .25s ease-out}
.toast.crit{border-left-color:var(--sign-red)}
.toast b{font-family:var(--f-display);font-size:15px}
.toast .pt{float:right;font:700 16px/1.3 var(--f-num);color:var(--amber)}
.toast.crit .pt{color:#ff7b81}
.toast p{margin:2px 0 0;color:var(--muted);font-size:12px}
@keyframes in{from{transform:translateX(-12px);opacity:.2}}

#dash{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 12px;pointer-events:auto}
.blk{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:22px;color:#4d5a69;display:grid;place-items:center;padding:0}
.blk.on{color:var(--go);border-color:var(--go)}
.blk.on.tick{background:rgba(31,199,154,.28)}
.spd{text-align:center;min-width:86px}
.spd b{font:700 46px/0.95 var(--f-num);font-variant-numeric:tabular-nums;display:block}
.spd b.over{color:var(--sign-red)}
.spd span{font-size:11px;color:var(--muted);letter-spacing:.08em}
#gear{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;font:700 24px/1 var(--f-num)}
#gear.rev{color:var(--amber);border-color:var(--amber)}

@media (hover:hover) and (pointer:fine){#dash.fp,#map.fp{display:none}}
@media (hover:none),(pointer:coarse){.card .keys{display:none}}
#app{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.overlay{touch-action:pan-y}
.steer{width:min(200px,44vw);height:72px;border-radius:36px;background:var(--panel);border:1px solid var(--line);position:relative;touch-action:none}
.steer::before,.steer::after{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.steer::before{content:"◀";left:12px}.steer::after{content:"▶";right:12px}
.knob{position:absolute;top:7px;left:50%;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:1}
.ctl{position:absolute;left:0;right:0;bottom:6px;display:none;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}
.gcol{display:grid;gap:8px;position:relative;pointer-events:auto}
#gearBtn{width:70px;height:70px;border-radius:16px;background:var(--panel);border:2px solid var(--go);font:700 32px/1 var(--f-num);touch-action:none;display:grid;place-items:center;position:relative}
#gearBtn.rev{border-color:var(--amber);color:var(--amber)}
#gearBtn i{position:absolute;right:6px;top:5px;font:400 12px/1 sans-serif;color:var(--muted)}
#hbBtn{touch-action:none;width:70px;height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:700 14px/1 var(--f-display)}
#hbBtn.on{background:var(--sign-red);border-color:var(--sign-red);color:#fff}
#gearStrip{position:absolute;bottom:100%;left:0;margin-bottom:8px;width:70px;display:grid;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#gearStrip span{height:36px;display:grid;place-items:center;font:700 20px/1 var(--f-num);color:var(--muted)}
#gearStrip span.on{background:var(--go);color:#06241b}
.bcol{display:flex;gap:10px;pointer-events:auto;align-self:flex-end}.bcol .blk{width:58px;height:58px;background:var(--panel);touch-action:none}
.scol{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto}
.tspd{display:none;text-align:center;min-width:46px}.tspd b{font:700 30px/1 var(--f-num);font-variant-numeric:tabular-nums;display:block}.tspd b.over{color:var(--sign-red)}.tspd small{font-size:10px;color:var(--muted)}
.stick{width:132px;height:132px;border-radius:50%;background:var(--panel);border:1px solid var(--line);position:relative;touch-action:none}
.stick span{position:absolute;font:700 12px/1 var(--f-display);color:var(--muted);pointer-events:none}
.stick .u{top:8px;left:50%;transform:translateX(-50%)}.stick .d{bottom:8px;left:50%;transform:translateX(-50%)}
.stick .lft{left:9px;top:50%;transform:translateY(-50%)}.stick .rgt{right:9px;top:50%;transform:translateY(-50%)}
.nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cap{font-size:10px;line-height:1.2;color:var(--paper);text-align:center;max-width:140px;text-shadow:0 1px 3px #000}
#hb{font:700 15px/1 var(--f-num);color:#4d5a69}#hb.on{color:#fff;background:var(--sign-red);border-color:var(--sign-red)}
.touchOnly{display:none}
@media (hover:none),(pointer:coarse){
  .touchOnly{display:block}
  .mini{min-height:36px;padding:6px 12px}
  .blk{width:50px;height:50px}
  #dash,#sndBtn,#endBtn,#fsBtn,#lightBtn,#mapBtn{display:none}
  #map{width:150px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .side .row{gap:8px!important}.mini{font-size:13px;min-width:54px;background:rgba(15,22,34,.72)}
  .ctl{display:flex}.tspd{display:block}
}
@media (max-width:480px){.stick{width:108px;height:108px}#gearBtn,#hbBtn{width:60px}#gearStrip{width:60px}.cap{font-size:9px;max-width:112px}}
@media (max-height:480px){
  #hud{padding-block:6px}
  #status{padding:5px 8px;gap:8px}.limit{width:38px;height:38px;border-width:5px;font-size:18px}.score b{font-size:22px}
  .board{padding:5px 10px;gap:8px;border-width:2px}.board .arrow{font-size:24px;width:26px}.board .txt{font-size:13px}.board .dist{font-size:16px}
  #hint{font-size:12px;padding:4px 8px}
  #map{width:128px}
  #toasts{top:70px;width:min(260px,40vw)}.toast p{display:none}
  .spd b{font-size:34px}.spd{min-width:64px}#dash{padding:4px 10px;gap:8px}
  .stick{width:112px;height:112px}.cap{display:none}#gearBtn{height:60px}#hbBtn{height:40px}.tspd b{font-size:22px}
  .card{padding:14px;gap:10px}.plate{padding:8px 14px}.plate h1{font-size:22px}.plate p{font-size:12px;margin-top:2px}.mode{padding:8px 12px}
}
@media (max-width:640px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  #instr{grid-column:1/-1;order:-1;justify-self:stretch}
  #map{width:132px}
  #toasts{top:206px}
  .board .txt{font-size:14px}
}

.overlay{position:absolute;inset:0;display:flex;background:rgba(8,12,20,.62);overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{margin:auto;width:min(620px,100%);background:var(--night);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.plate{background:var(--sign-blue);border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2px var(--sign-blue);padding:14px 18px}
.plate h1{margin:0;font:900 clamp(24px,5.4vw,36px)/1.15 var(--f-display);letter-spacing:.04em;text-wrap:balance}
.plate p{margin:6px 0 0;font-size:14px;opacity:.92}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:7px 14px;cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--paper);color:var(--night)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mode{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:block}
.mode:has(input:checked){border-color:var(--go);background:rgba(31,199,154,.1)}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode b{font:700 17px/1.3 var(--f-display);display:block}
.mode span{font-size:13px;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
kbd{font:600 12px/1 var(--f-num);background:#243044;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--paper);letter-spacing:.04em}
.cta{background:var(--go);color:#06241b;border:0;border-radius:10px;padding:12px 26px;font:900 18px/1 var(--f-display)}
.cta:hover{filter:brightness(1.1)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 20px;font:700 15px/1 var(--f-display)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--go);width:16px;height:16px}

.verdict{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stamp{font:900 34px/1 var(--f-display);border:4px solid currentColor;border-radius:10px;padding:10px 16px;transform:rotate(-4deg);letter-spacing:.1em}
.stamp.pass{color:var(--go)}.stamp.fail{color:#ff5a62}
.big{font:700 56px/0.9 var(--f-num);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);margin-left:4px}
.list{display:grid;gap:8px;max-height:38vh;overflow:auto;margin:0;padding:0;list-style:none}
.list li{border-left:4px solid var(--amber);background:rgba(255,255,255,.05);border-radius:6px;padding:8px 10px}
.list li.crit{border-left-color:var(--sign-red)}
.list b{font-family:var(--f-display)}
.list .pt{float:right;font:700 17px/1.2 var(--f-num)}
.list p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <canvas id="glass"></canvas>
  <div id="glare"></div>
  <div id="hud" hidden><div class="hud-in">
    <div class="top">
      <div id="status" class="panel">
        <div class="limit" id="limit">40</div>
        <div class="tspd"><b id="spd2">0</b><small>km/h</small></div>
        <div class="score"><small data-t="score">持ち点</small><b id="score">100</b></div>
        <span id="crit" hidden></span>
      </div>
      <div id="instr">
        <div class="board"><span class="arrow" id="iArrow">↑</span><span class="txt" id="iTxt"></span><span class="dist" id="iDist"></span></div>
        <div id="hint" hidden></div>
      </div>
      <div class="side">
        <canvas id="map" width="300" height="230"></canvas>
        <div class="row" style="gap:6px;justify-content:flex-end">
          <button class="mini" id="fsBtn" type="button" data-t="fsBtn"></button>
          <button class="mini" id="mapBtn" type="button" data-t="mapBtn"></button>
          <button class="mini" id="lightBtn" type="button"></button>
          <button class="mini" id="sndBtn" type="button"></button>
          <button class="mini" id="camBtn" type="button" data-t="cam"></button>
          <button class="mini" id="pauseBtn" type="button" data-t="pause"></button>
          <button class="mini" id="endBtn" type="button" data-t="end"></button>
        </div>
      </div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <button class="stk" id="stkL" type="button"><i></i><span data-t="stkL"></span></button>
    <button class="stk" id="stkR" type="button"><i></i><span data-t="stkR"></span></button>
    <div id="dash" class="panel">
      <button class="blk" id="bL" type="button" aria-label="left signal">◀</button>
      <div class="spd"><b id="spd">0</b><span>km/h</span></div>
      <button class="blk" id="bR" type="button" aria-label="right signal">▶</button>
      <button id="gear" type="button" aria-label="gear">P</button>
      <button id="hb" class="blk" type="button" aria-label="parking brake">(P)</button>
    </div>
    <div class="ctl">
      <div class="gcol">
        <div id="gearStrip" hidden><span>P</span><span>R</span><span>N</span><span>D</span></div>
        <button id="gearBtn" type="button" aria-label="gear"><b id="gearLbl">P</b><i>↕</i></button>
        <button id="hbBtn" type="button" data-t="hbLbl"></button>
      </div>
      <div class="bcol"><button class="blk" id="tbL" type="button" aria-label="left signal">◀</button><button class="blk" id="tbR" type="button" aria-label="right signal">▶</button></div>
      <div style="flex:1"></div>
      <div class="scol"><div class="stick" id="stR"><span class="u" data-t="gas"></span><span class="d" data-t="brake"></span><span class="lft">⇦</span><span class="rgt">⇨</span><div class="nub"></div></div><div class="cap" data-t="capR"></div></div>
    </div>
  </div></div>

  <div id="start" class="overlay">
    <div class="card">
      <div class="plate"><h1>路上教習シミュレーター</h1><p data-t="sub"></p></div>
      <div class="row">
        <div class="seg" role="radiogroup" aria-label="Language">
          <label><input type="radio" name="lang" id="langZh" value="zh" checked>中文</label>
          <label><input type="radio" name="lang" id="langJa" value="ja">日本語</label>
        </div>
        <label class="chk"><input type="checkbox" id="hintsOn" checked><span data-t="hints"></span></label>
      </div>
      <div class="row">
        <span class="lbl" data-t="lblTime"></span>
        <div class="seg"><label><input type="radio" name="tod" value="day" checked><span data-t="tDay"></span></label><label><input type="radio" name="tod" value="dusk"><span data-t="tDusk"></span></label><label><input type="radio" name="tod" value="night"><span data-t="tNight"></span></label><label><input type="radio" name="tod" value="cycle"><span data-t="tCycle"></span></label></div>
        <span class="lbl" data-t="lblWx"></span>
        <div class="seg"><label><input type="radio" name="wx" value="clear" checked><span data-t="wClear"></span></label><label><input type="radio" name="wx" value="rain"><span data-t="wRain"></span></label><label><input type="radio" name="wx" value="snow"><span data-t="wSnow"></span></label><label><input type="radio" name="wx" value="auto"><span data-t="wAuto"></span></label></div>
      </div>
      <div class="modes">
        <label class="mode"><input type="radio" name="mode" id="modeCourse" value="course" checked><b data-t="mCourse"></b><span data-t="mCourseD"></span></label>
        <label class="mode"><input type="radio" name="mode" id="modeFree" value="free"><b data-t="mFree"></b><span data-t="mFreeD"></span></label>
        <label class="mode"><input type="radio" name="mode" id="modeHw" value="hw"><b data-t="mHw"></b><span data-t="mHwD"></span></label>
      </div>
      <ul class="keys">
        <li><kbd>W</kbd> <kbd>↑</kbd> <span data-t="kGas"></span></li>
        <li><kbd>S</kbd> <kbd>↓</kbd> <span data-t="kBrake"></span></li>
        <li><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> <span data-t="kSteer"></span></li>
        <li><kbd>Q</kbd> <kbd>E</kbd> <span data-t="kBlink"></span></li>
        <li><kbd>Z</kbd> <kbd>C</kbd> <span data-t="kLook"></span></li>
        <li><kbd>Shift</kbd> <kbd>X</kbd> <span data-t="kGear"></span></li>
        <li><kbd>Space</kbd> <span data-t="kHb"></span></li>
        <li><kbd>L</kbd> <span data-t="kLight"></span></li>
        <li><kbd>K</kbd> <span data-t="kWiper"></span></li>
        <li><kbd>M</kbd> <span data-t="kMap"></span></li>
        <li><kbd>V</kbd> <span data-t="kCam"></span></li>
        <li><kbd>P</kbd> <kbd>Esc</kbd> <span data-t="kPause"></span></li>
        <li><kbd>MOUSE</kbd> <span data-t="kDrag"></span></li>
